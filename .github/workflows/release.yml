name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            arch-name: x86_64
            apt_arch: amd64
            appimage_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm64
            arch-name: aarch64
            apt_arch: arm64
            appimage_arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ruby-full desktop-file-utils file patchelf curl \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Install Nim dependencies
        run: |
          nimble install --accept parsetoml tempfile "https://github.com/nimgl/imgui.git@#0079c2d" nimgl

      - name: Install libcoap from distro packages
        run: |
          sudo apt-get install -y libcoap3-dev
          sudo ldconfig

      - name: Build cimgui
        run: |
          IMGUI_DIR="$(nimble path imgui)"
          make -C "$IMGUI_DIR/imgui/private/cimgui"

      - name: Build application
        run: |
          nim buildRelease src/gui/main
          mkdir -p dist/linux
          cp build/bin/cotel dist/linux/cotel

      - name: Prepare AppImage inputs
        run: |
          mkdir -p dist/release
          IMGUI_DIR="$(nimble path imgui)"
          CIMGUI_LIB="$(find "$IMGUI_DIR/imgui/private/cimgui" -maxdepth 2 -type f \( -name 'libcimgui.so' -o -name 'libcimgui.so.*' \) | head -n 1)"
          if [ -n "$CIMGUI_LIB" ]; then
            cp "$CIMGUI_LIB" dist/linux/
          fi

      - name: Render AppImage recipe
        run: |
          cp .github/appimage/AppImageBuilder.yml .github/appimage/AppImageBuilder.generated.yml
          sed -i "s|__APT_ARCH__|${{ matrix.apt_arch }}|g" .github/appimage/AppImageBuilder.generated.yml
          sed -i "s|__APPIMAGE_ARCH__|${{ matrix.appimage_arch }}|g" .github/appimage/AppImageBuilder.generated.yml

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage@master
        with:
          recipe: .github/appimage/AppImageBuilder.generated.yml

      - name: Stage AppImage artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv *.AppImage "dist/release/Cotel-${VERSION}-${{ matrix.arch-name }}.AppImage"

      - name: Build deb package
        uses: ./.github/actions/build-deb-package
        with:
          version: ${{ github.ref_name }}
          binary_path: dist/linux/cotel
          desktop_file: resources/cotel.desktop
          icon_file: resources/cotel32.png

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          path: dist/release/*

  windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install Nim dependencies
        shell: pwsh
        run: |
          nimble install --accept parsetoml tempfile "https://github.com/nimgl/imgui.git@#0079c2d" nimgl

      - name: Build cimgui
        shell: bash
        run: |
          IMGUI_DIR="$(nimble path imgui)"
          make -C "$IMGUI_DIR/imgui/private/cimgui"

      - name: Install libcoap with vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          pkgs: libcoap
          triplet: x64-windows-release
          token: ${{ github.token }}

      - name: Export vcpkg environment
        shell: pwsh
        run: |
          $installed = Join-Path $env:GITHUB_WORKSPACE "vcpkg\installed\x64-windows-release"
          "INCLUDE=$installed\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$installed\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=$installed\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build application
        shell: pwsh
        run: |
          nim buildRelease src/gui/main
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item build/bin/cotel.exe dist/windows/cotel.exe

      - name: Package executable
        shell: pwsh
        run: |
          Copy-Item resources/cotel.conf dist/windows/
          if (Test-Path "$env:VCPKG_INSTALLED\bin") {
            Get-ChildItem "$env:VCPKG_INSTALLED\bin" -Filter "*coap*.dll" | ForEach-Object {
              Copy-Item $_.FullName dist/windows/
            }
          }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/cotel-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/cotel-windows.zip

  macos:
    name: Build macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: macos-latest
            output-name: cotel-macos.zip
          - arch: arm64
            runner: macos-14-arm64
            output-name: cotel-macos-arm64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Install Nim dependencies
        run: |
          nimble install --accept parsetoml tempfile "https://github.com/nimgl/imgui.git@#0079c2d" nimgl

      - name: Build cimgui
        run: |
          IMGUI_DIR="$(nimble path imgui)"
          make -C "$IMGUI_DIR/imgui/private/cimgui"

      - name: Install libcoap with Homebrew
        run: |
          brew update
          brew install libcoap

          BREW_PREFIX="$(brew --prefix)"
          echo "CPPFLAGS=-I$BREW_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$BREW_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LIBCOAP_BREW_PREFIX=$BREW_PREFIX" >> "$GITHUB_ENV"

      - name: Build application
        run: |
          nim buildRelease src/gui/main
          mkdir -p dist/macos
          cp build/bin/cotel dist/macos/cotel

      - name: Package app bundle
        uses: ./.github/actions/package-macos-app
        with:
          version: ${{ github.ref_name }}
          binary_path: dist/macos/cotel
          config_file: resources/cotel.conf
          icon_file: resources/cotel32.png
          libcoap_brew_prefix: ${{ env.LIBCOAP_BREW_PREFIX }}

      - name: Rename artifact for ARM64
        if: matrix.arch == 'arm64'
        run: |
          mv dist/cotel-macos.zip dist/${{ matrix.output-name }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: dist/${{ matrix.output-name }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-packages
          path: release-artifacts/linux-x86_64

      - name: Download Linux aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64-packages
          path: release-artifacts/linux-aarch64

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-artifacts/windows

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-package
          path: release-artifacts/macos-x86_64

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-package
          path: release-artifacts/macos-arm64

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/linux-x86_64/*
            release-artifacts/linux-aarch64/*
            release-artifacts/windows/*
            release-artifacts/macos-x86_64/*
            release-artifacts/macos-arm64/*
